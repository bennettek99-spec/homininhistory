<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AADR Genome Atlas — an interactive globe of ancient human genomes</title>
<meta name="description" content="Explore all 23,089 individuals in the Allen Ancient DNA Resource on an interactive 3D globe — across space, time, culture and genetics.">
<link rel="canonical" href="https://homininhistory.com/atlas/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hominin History">
<meta property="og:title" content="AADR Genome Atlas — an interactive globe of ancient human genomes">
<meta property="og:description" content="All 23,089 individuals in the Allen Ancient DNA Resource, mapped on a 3D globe across space, time, culture and genetics.">
<meta property="og:url" content="https://homininhistory.com/atlas/">
<meta property="og:image" content="https://homininhistory.com/assets/og/blog.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="AADR Genome Atlas">
<meta name="twitter:description" content="All 23,089 individuals in the Allen Ancient DNA Resource, mapped on an interactive 3D globe.">
<meta name="twitter:image" content="https://homininhistory.com/assets/og/blog.png">
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='none' stroke='%23f0b429' stroke-width='2'/><ellipse cx='16' cy='16' rx='5.5' ry='13' fill='none' stroke='%23f0b429' stroke-width='1.4'/><path d='M3.6 12h24.8M3.6 20h24.8' stroke='%23f0b429' stroke-width='1.4'/></svg>">
</head>
<body>

<!-- ══ Deep background: starfield + atmospheric wash ══════════════════════ -->
<canvas id="starfield" aria-hidden="true"></canvas>
<div id="vignette" aria-hidden="true"></div>

<!-- ══ Globe ═════════════════════════════════════════════════════════════ -->
<div id="globe-host">
  <canvas id="deck-canvas"></canvas>
</div>

<!-- ══ Boot screen ═══════════════════════════════════════════════════════ -->
<div id="boot" role="status" aria-live="polite">
  <div class="boot-inner">
    <div class="boot-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64"><circle class="bm-o" cx="32" cy="32" r="26"/><ellipse class="bm-e" cx="32" cy="32" rx="11" ry="26"/><path class="bm-l" d="M6 22h52M6 42h52"/></svg>
    </div>
    <h1 class="boot-title">AADR Globe&nbsp;Explorer</h1>
    <p class="boot-sub">The Allen Ancient DNA Resource, mapped in space and time</p>
    <div class="boot-bar"><i id="boot-fill"></i></div>
    <p class="boot-step" id="boot-step">Initialising…</p>
    <p class="boot-err" id="boot-err" hidden></p>
  </div>
</div>

<!-- ══ Top bar ═══════════════════════════════════════════════════════════ -->
<header id="topbar" class="glass">
  <a id="site-back" href="/" title="Back to Hominin History" aria-label="Back to Hominin History">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span>Hominin History</span>
  </a>
  <button id="brand" class="brand" title="About this atlas" aria-label="About this atlas">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><ellipse cx="16" cy="16" rx="5.5" ry="13"/><path d="M3.6 12h24.8M3.6 20h24.8"/></svg>
    <span class="brand-text"><b>AADR</b> Globe Explorer</span>
  </button>

  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2 21 21"/></svg>
    <input id="search" type="search" placeholder="Search 23,000 individuals, sites, cultures, papers…"
           autocomplete="off" spellcheck="false" aria-label="Search" aria-expanded="false"
           aria-controls="search-results" role="combobox">
    <kbd class="search-kbd">/</kbd>
    <div id="search-results" class="glass" role="listbox" hidden></div>
  </div>

  <div class="topbar-actions">
    <span id="count-pill" class="pill" title="Individuals matching the current filters">
      <b id="count-n">—</b><span class="pill-sub">of 23,089</span>
    </span>
    <button class="icon-btn" id="btn-story" title="Guided tours" aria-label="Guided tours">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v18H6.5A2.5 2.5 0 0 0 4 18.5z"/><path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v18h5.5a2.5 2.5 0 0 1 2.5 2.5z" transform="translate(0,-2.5)"/></svg>
    </button>
    <button class="icon-btn" id="btn-charts" title="Analytics panel" aria-label="Analytics panel">
      <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </button>
    <button class="icon-btn" id="btn-layers" title="Map layers" aria-label="Map layers">
      <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button class="icon-btn" id="btn-export" title="Export current selection" aria-label="Export">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
    </button>
    <button class="icon-btn only-mobile" id="btn-filters-m" title="Filters" aria-label="Filters">
      <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
    </button>
    <button class="icon-btn only-mobile" id="btn-more" title="More" aria-label="More options"
            aria-expanded="false" aria-controls="more">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
  </div>
</header>

<!-- ══ Mobile action sheet ═══════════════════════════════════════════════
     The topbar cannot hold every action at phone widths. Rather than drop
     Analytics and Story Mode — which is what the old breakpoint did, making
     them unreachable on a phone — they move here. Rows are built in main.js
     and forward their click to the real control, so there is still exactly
     one implementation of each action. ─────────────────────────────────── -->
<div id="more" class="sheet-scrim mobile-sheet" hidden>
  <div class="msheet glass" role="dialog" aria-label="More options">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="msheet-list" id="more-list"></div>
  </div>
</div>

<!-- ══ Left rail: filters ════════════════════════════════════════════════ -->
<aside id="rail" class="glass panel" aria-label="Filters">
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="panel-head">
    <h2>Filters</h2>
    <div class="panel-head-actions">
      <button class="text-btn" id="btn-reset">Reset</button>
      <button class="icon-btn sm only-mobile" id="btn-rail-close" aria-label="Close filters">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="panel-body" id="filter-body"><!-- built by filters.js --></div>
  <div class="panel-foot">
    <div class="foot-stat"><b id="rail-n">—</b> individuals</div>
    <div class="foot-stat"><b id="rail-sites">—</b> sites</div>
  </div>
</aside>

<!-- ══ Right: detail panel ═══════════════════════════════════════════════ -->
<aside id="detail" class="glass panel" aria-label="Details" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="panel-head">
    <div class="detail-head-text">
      <h2 id="detail-title">—</h2>
      <p id="detail-sub"></p>
    </div>
    <div class="panel-head-actions">
      <button class="icon-btn sm" id="btn-compare-add" title="Add to comparison" aria-label="Add to comparison">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button class="icon-btn sm" id="btn-detail-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="panel-body" id="detail-body"></div>
</aside>

<!-- ══ Analytics drawer ══════════════════════════════════════════════════ -->
<aside id="charts" class="glass panel" aria-label="Analytics" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="panel-head">
    <h2>Analytics</h2>
    <div class="panel-head-actions">
      <button class="icon-btn sm" id="btn-charts-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </div>
  <nav class="tabs" id="chart-tabs" role="tablist">
    <button class="tab is-on" data-tab="time" role="tab">Time</button>
    <button class="tab" data-tab="quality" role="tab">Quality</button>
    <button class="tab" data-tab="geography" role="tab">Geography</button>
    <button class="tab" data-tab="haplo" role="tab">Haplogroups</button>
    <button class="tab" data-tab="pca" role="tab">Ordination</button>
    <button class="tab" data-tab="papers" role="tab">Papers</button>
    <button class="tab" data-tab="modules" role="tab">Modules</button>
  </nav>
  <div class="panel-body" id="charts-body"></div>
</aside>

<!-- ══ Layers popover ════════════════════════════════════════════════════ -->
<div id="layers" class="glass popover" hidden aria-label="Map layers">
  <div class="pop-head"><h3>Globe</h3></div>
  <div class="pop-body" id="layers-body"></div>
</div>

<!-- ══ Story mode ════════════════════════════════════════════════════════ -->
<div id="story" class="glass popover wide" hidden aria-label="Guided tours">
  <div class="pop-head">
    <h3>Guided tours</h3>
    <button class="icon-btn sm" id="btn-story-close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="pop-body" id="story-body"></div>
</div>

<div id="story-hud" class="glass" hidden>
  <div class="hud-top">
    <span class="hud-chapter" id="hud-chapter">—</span>
    <button class="icon-btn sm" id="hud-exit" aria-label="End tour">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <h3 id="hud-title">—</h3>
  <p id="hud-text"></p>
  <div class="hud-nav">
    <button class="btn ghost" id="hud-prev">Back</button>
    <div class="hud-dots" id="hud-dots"></div>
    <button class="btn" id="hud-next">Next</button>
  </div>
</div>

<!-- ══ Compare tray ══════════════════════════════════════════════════════ -->
<div id="compare" class="glass" hidden aria-label="Compare individuals">
  <div class="cmp-head">
    <h3>Compare</h3>
    <button class="icon-btn sm" id="btn-compare-close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="cmp-body" id="compare-body"></div>
</div>

<!-- ══ Timeline ══════════════════════════════════════════════════════════ -->
<div id="timeline" class="glass" aria-label="Time range">
  <div class="tl-left">
    <button class="icon-btn" id="tl-play" title="Animate through time" aria-label="Play">
      <svg id="tl-play-icon" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></svg>
    </button>
    <div class="tl-readout">
      <b id="tl-label">500 ka BP — present</b>
      <span id="tl-count">—</span>
    </div>
  </div>
  <div class="tl-track-wrap">
    <canvas id="tl-density" aria-hidden="true"></canvas>
    <div class="tl-track" id="tl-track">
      <div class="tl-fill" id="tl-fill"></div>
      <button class="tl-handle" id="tl-h0" aria-label="Earliest date" role="slider" aria-valuemin="0" aria-valuemax="500000"></button>
      <button class="tl-handle" id="tl-h1" aria-label="Latest date" role="slider" aria-valuemin="0" aria-valuemax="500000"></button>
    </div>
    <div class="tl-axis" id="tl-axis"></div>
  </div>
</div>

<!-- ══ Globe HUD ═════════════════════════════════════════════════════════ -->
<div id="hud-legend" class="glass" aria-label="Legend">
  <div class="lg-head">
    <span id="lg-title">Period</span>
    <select id="lg-mode" aria-label="Colour points by">
      <option value="period">Colour by period</option>
      <option value="region">Colour by region</option>
      <option value="subsistence">Colour by subsistence</option>
      <option value="coverage">Colour by coverage</option>
      <option value="sex">Colour by sex</option>
      <option value="assessment">Colour by QC</option>
      <option value="mtRoot">Colour by mtDNA clade</option>
      <option value="yRoot">Colour by Y clade</option>
    </select>
  </div>
  <div class="lg-items" id="lg-items"></div>
</div>

<div id="hud-right">
  <button class="icon-btn glass" id="btn-home" title="Reset view" aria-label="Reset view">
    <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M6 10v10h12V10"/></svg>
  </button>
  <button class="icon-btn glass" id="btn-zin" title="Zoom in" aria-label="Zoom in">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="icon-btn glass" id="btn-zout" title="Zoom out" aria-label="Zoom out">
    <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
  </button>
  <button class="icon-btn glass" id="btn-2d" title="Toggle flat map" aria-label="Toggle flat map">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M9 5v14"/></svg>
  </button>
</div>

<div id="tooltip" hidden></div>
<div id="toasts" aria-live="polite"></div>

<!-- ══ About / provenance sheet ══════════════════════════════════════════ -->
<div id="about" class="sheet-scrim" hidden>
  <div class="sheet glass">
    <div class="sheet-head">
      <h2>About this atlas</h2>
      <button class="icon-btn sm" id="btn-about-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="about-body"></div>
  </div>
</div>

<script src="vendor/deck.gl.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
