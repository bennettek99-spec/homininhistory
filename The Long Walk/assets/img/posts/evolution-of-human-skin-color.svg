<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Diagram showing ultraviolet radiation falling from the equator to high latitudes, with folate protection favouring dark skin in high-UV regions and vitamin D production favouring lighter skin in low-UV regions"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">Skin colour tracks ultraviolet light</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">Two pressures pull in opposite directions as latitude rises</text><defs><linearGradient id="sk" x1="0" x2="1"><stop offset="0" stop-color="#4a2c1a"/><stop offset=".35" stop-color="#7a4a2c"/><stop offset=".7" stop-color="#b98a62"/><stop offset="1" stop-color="#e2c3a0"/></linearGradient></defs><polyline points="110.0,170.0 134.5,170.3 159.0,171.2 183.5,172.8 208.0,174.9 232.5,177.6 257.0,181.0 281.5,184.8 306.0,189.3 330.5,194.3 355.0,199.7 379.5,205.7 404.0,212.2 428.5,219.0 453.0,226.3 477.5,233.9 502.0,241.9 526.5,250.2 551.0,258.7 575.5,267.5 600.0,276.4 624.5,285.5 649.0,294.7 673.5,303.9 698.0,313.2 722.5,322.4 747.0,331.5 771.5,340.5 796.0,349.3 820.5,357.9 845.0,366.2 869.5,374.2 894.0,381.8 918.5,389.0 943.0,395.6 967.5,401.7 992.0,407.2 1016.5,411.9 1041.0,415.7 1065.5,418.6 1090.0,420.0" fill="none" stroke="#a9791f" stroke-width="4"/><text x="120.0" y="160.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#a9791f" text-anchor="start" font-weight="700" >UV intensity</text><line x1="110.0" y1="430.0" x2="1090.0" y2="430.0" stroke="#241b12" stroke-width="2" /><text x="110.0" y="455.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#6c5f4d" text-anchor="start" font-weight="400" >Equator</text><text x="600.0" y="455.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#6c5f4d" text-anchor="middle" font-weight="400" >Mid latitudes</text><text x="1090.0" y="455.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#6c5f4d" text-anchor="end" font-weight="400" >High latitudes</text><rect x="110.0" y="470.0" width="980.0" height="34.0" rx="6" fill="url(#sk)" /><rect x="150.0" y="250.0" width="330.0" height="92.0" rx="8" fill="#fbf6ec" stroke="#b4531f" stroke-width="2"/><text x="170.0" y="282.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#b4531f" text-anchor="start" font-weight="700" >High UV: protect folate</text><text x="170.0" y="308.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >dense eumelanin favoured</text><text x="170.0" y="328.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >(dark skin by ~1.2 Ma, est.)</text><rect x="720.0" y="180.0" width="350.0" height="92.0" rx="8" fill="#fbf6ec" stroke="#2f6f6a" stroke-width="2"/><text x="740.0" y="212.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#2f6f6a" text-anchor="start" font-weight="700" >Low UV: make vitamin D</text><text x="740.0" y="238.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >lighter skin favoured</text><text x="740.0" y="258.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >(evolved separately in Europe &amp; E. Asia)</text><text x="600.0" y="540.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >A simplified cline: migration, diet and recent ancestry blur it in real populations</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Schematic, not to scale. Based on the folate–vitamin D model described in the article.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>