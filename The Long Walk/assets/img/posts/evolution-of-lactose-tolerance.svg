<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Diagram of the MCM6 and LCT genes on chromosome 2, with four lactase persistence variants in the MCM6 enhancer: minus 13907 G in Ethiopia and Sudan, minus 13910 T in Europe and South Asia, minus 13915 G in Arabia and the Middle East, and minus 14010 C in East Africa"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">Four switches, one result: milk digestion for life</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">Lactase-persistence variants sit in an enhancer inside MCM6, upstream of LCT</text><line x1="70.0" y1="210.0" x2="1130.0" y2="210.0" stroke="#241b12" stroke-width="3" /><rect x="160.0" y="186.0" width="520.0" height="48.0" rx="6" fill="#e7d3c2" /><text x="420.0" y="217.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="18" fill="#241b12" text-anchor="middle" font-weight="600" >MCM6 gene</text><rect x="820.0" y="186.0" width="250.0" height="48.0" rx="6" fill="#2f6f6a" /><text x="945.0" y="217.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="18" fill="#f7f0e3" text-anchor="middle" font-weight="600" >LCT (lactase) gene</text><path d="M1080 210 l20 0" stroke="#2f6f6a" stroke-width="3"/><rect x="330.0" y="180.0" width="90.0" height="60.0" rx="4" fill="none" stroke="#b4531f" stroke-width="2.5"/><text x="375.0" y="170.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#b4531f" text-anchor="middle" font-weight="400" >enhancer</text><path d="M330 240 L110 300 M420 240 L1090 300" stroke="#b4531f" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/><rect x="110.0" y="300.0" width="980.0" height="250.0" rx="10" fill="#fbf6ec" stroke="#ddd1bd"/><circle cx="162" cy="345" r="10" fill="#a9791f"/><text x="182.0" y="351.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" fill="#241b12" text-anchor="start" font-weight="700" >−14010*C</text><text x="150.0" y="395.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >East Africa</text><text x="150.0" y="415.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >(Kenya, Tanzania)</text><text x="150.0" y="450.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#241b12" text-anchor="start" font-weight="400" >~3,000–7,000 yr</text><text x="150.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#a3957f" text-anchor="start" font-weight="400" >old (approx.)</text><circle cx="397" cy="345" r="10" fill="#a9791f"/><text x="417.0" y="351.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" fill="#241b12" text-anchor="start" font-weight="700" >−13915*G</text><text x="385.0" y="395.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >Arabian Peninsula</text><text x="385.0" y="415.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >and Middle East</text><text x="385.0" y="450.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#241b12" text-anchor="start" font-weight="400" >several thousand yr</text><text x="385.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#a3957f" text-anchor="start" font-weight="400" >old (approx.)</text><circle cx="632" cy="345" r="10" fill="#b4531f"/><text x="652.0" y="351.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" fill="#241b12" text-anchor="start" font-weight="700" >−13910*T</text><text x="620.0" y="395.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >N. &amp; W. Europe</text><text x="620.0" y="415.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >also South Asia</text><text x="620.0" y="450.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#241b12" text-anchor="start" font-weight="400" >~5,000–10,000 yr</text><text x="620.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#a3957f" text-anchor="start" font-weight="400" >old (approx.)</text><circle cx="867" cy="345" r="10" fill="#a9791f"/><text x="887.0" y="351.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" fill="#241b12" text-anchor="start" font-weight="700" >−13907*G</text><text x="855.0" y="395.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >Ethiopia</text><text x="855.0" y="415.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >and Sudan</text><text x="855.0" y="450.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#241b12" text-anchor="start" font-weight="400" >several thousand yr</text><text x="855.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#a3957f" text-anchor="start" font-weight="400" >old (approx.)</text><text x="600.0" y="515.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#2f6f6a" text-anchor="middle" font-weight="400" >Each variant independently keeps LCT switched on after weaning</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Variant positions are counted in base pairs upstream of LCT. Ages are approximate.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>