<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Four panels on recent human evolution: Bajau divers with spleens about 50 percent larger linked to PDE10A; Tibetans with an EPAS1 variant inherited from Denisovans; malaria protection from the sickle allele and the Duffy-null variant; and a 2016 claim of recent selection for height in Britain that did not survive scrutiny"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">Human evolution in the last few thousand years</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">Selection signals that hold up, and one that did not</text><rect x="60.0" y="150.0" width="255.0" height="360.0" rx="12" fill="#fbf6ec" stroke="#2f6f6a" stroke-width="2.5"/><rect x="60.0" y="150.0" width="255.0" height="10.0" rx="4" fill="#2f6f6a" /><text x="80.0" y="206.0" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#241b12" text-anchor="start" font-weight="600" >Bajau sea nomads</text><text x="80.0" y="234.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >Indonesia</text><text x="80.0" y="290.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >Spleens ~50% larger</text><text x="80.0" y="316.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >than a neighbouring</text><text x="80.0" y="342.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >land-living group;</text><text x="80.0" y="368.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >linked to PDE10A</text><text x="80.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#2f6f6a" text-anchor="start" font-weight="700" >✓ well supported</text><rect x="335.0" y="150.0" width="255.0" height="360.0" rx="12" fill="#fbf6ec" stroke="#2f6f6a" stroke-width="2.5"/><rect x="335.0" y="150.0" width="255.0" height="10.0" rx="4" fill="#2f6f6a" /><text x="355.0" y="206.0" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#241b12" text-anchor="start" font-weight="600" >Tibetans</text><text x="355.0" y="234.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >High-altitude plateau</text><text x="355.0" y="290.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >EPAS1 variant from</text><text x="355.0" y="316.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >Denisovans avoids</text><text x="355.0" y="342.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >dangerously thick</text><text x="355.0" y="368.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >blood at altitude</text><text x="355.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#2f6f6a" text-anchor="start" font-weight="700" >✓ well supported</text><rect x="610.0" y="150.0" width="255.0" height="360.0" rx="12" fill="#fbf6ec" stroke="#2f6f6a" stroke-width="2.5"/><rect x="610.0" y="150.0" width="255.0" height="10.0" rx="4" fill="#2f6f6a" /><text x="630.0" y="206.0" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#241b12" text-anchor="start" font-weight="600" >Malaria regions</text><text x="630.0" y="234.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >Africa and beyond</text><text x="630.0" y="290.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >Sickle allele and</text><text x="630.0" y="316.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >Duffy-null variant</text><text x="630.0" y="342.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >protect against</text><text x="630.0" y="368.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >malaria</text><text x="630.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#2f6f6a" text-anchor="start" font-weight="700" >✓ well supported</text><rect x="885.0" y="150.0" width="255.0" height="360.0" rx="12" fill="#fbf6ec" stroke="#b4531f" stroke-width="2.5"/><rect x="885.0" y="150.0" width="255.0" height="10.0" rx="4" fill="#b4531f" /><text x="905.0" y="206.0" font-family="Georgia,'Times New Roman',serif" font-size="22" fill="#241b12" text-anchor="start" font-weight="600" >Height in Britain</text><text x="905.0" y="234.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="start" font-weight="400" >2016 claim</text><text x="905.0" y="290.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >Reported recent</text><text x="905.0" y="316.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >selection for height;</text><text x="905.0" y="342.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >the signal did not</text><text x="905.0" y="368.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="15" fill="#241b12" text-anchor="start" font-weight="400" >survive re-analysis</text><text x="905.0" y="470.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#b4531f" text-anchor="start" font-weight="700" >✗ not supported</text><line x1="905.0" y1="200.0" x2="1117.5" y2="200.0" stroke="#b4531f" stroke-width="2.5" /><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Examples drawn from the studies discussed in the article.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>