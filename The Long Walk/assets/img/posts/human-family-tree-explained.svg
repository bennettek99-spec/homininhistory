<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Chart of the main hominin genera through time: Sahelanthropus about 7 million years ago, Orrorin about 6, Ardipithecus 5.8 to 4.4, Australopithecus 4.2 to 2, Paranthropus 2.7 to 1, and Homo from 2.8 million years ago to today"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">The human family tree, genus by genus</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">Time ranges of the main hominin genera, millions of years ago</text><line x1="130.0" y1="140.0" x2="1120.0" y2="140.0" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="145.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >today</text><line x1="130.0" y1="193.3" x2="1120.0" y2="193.3" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="198.3" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >1 Ma</text><line x1="130.0" y1="246.7" x2="1120.0" y2="246.7" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="251.7" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >2 Ma</text><line x1="130.0" y1="300.0" x2="1120.0" y2="300.0" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="305.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >3 Ma</text><line x1="130.0" y1="353.3" x2="1120.0" y2="353.3" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="358.3" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >4 Ma</text><line x1="130.0" y1="406.7" x2="1120.0" y2="406.7" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="411.7" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >5 Ma</text><line x1="130.0" y1="460.0" x2="1120.0" y2="460.0" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="465.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >6 Ma</text><line x1="130.0" y1="513.3" x2="1120.0" y2="513.3" stroke="#ddd1bd" stroke-width="1" /><text x="115.0" y="518.3" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="end" font-weight="400" >7 Ma</text><rect x="186.0" y="502.7" width="28.0" height="21.3" rx="6" fill="#a3957f" /><text x="224.0" y="519.3" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#241b12" text-anchor="start" font-weight="600" >Sahelanthropus</text><rect x="316.0" y="444.0" width="28.0" height="21.3" rx="6" fill="#a3957f" /><text x="354.0" y="460.7" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#241b12" text-anchor="start" font-weight="600" >Orrorin</text><rect x="446.0" y="374.7" width="28.0" height="74.7" rx="6" fill="#a9791f" /><text x="484.0" y="418.0" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#241b12" text-anchor="start" font-weight="600" >Ardipithecus</text><rect x="596.0" y="246.7" width="28.0" height="117.3" rx="6" fill="#a9791f" /><text x="634.0" y="311.3" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#241b12" text-anchor="start" font-weight="600" >Australopithecus</text><rect x="766.0" y="193.3" width="28.0" height="90.7" rx="6" fill="#6c5f4d" /><text x="804.0" y="244.7" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#241b12" text-anchor="start" font-weight="600" >Paranthropus</text><rect x="936.0" y="140.0" width="28.0" height="149.3" rx="6" fill="#b4531f" /><text x="974.0" y="220.7" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#241b12" text-anchor="start" font-weight="600" >Homo</text><line x1="200.0" y1="502.7" x2="330.0" y2="465.3" stroke="#2f6f6a" stroke-width="2" stroke-dasharray="6 5"/><line x1="330.0" y1="444.0" x2="460.0" y2="449.3" stroke="#2f6f6a" stroke-width="2" stroke-dasharray="6 5"/><line x1="460.0" y1="374.7" x2="610.0" y2="364.0" stroke="#2f6f6a" stroke-width="2" stroke-dasharray="6 5"/><line x1="610.0" y1="289.3" x2="780.0" y2="284.0" stroke="#2f6f6a" stroke-width="2" stroke-dasharray="6 5"/><line x1="610.0" y1="294.7" x2="950.0" y2="289.3" stroke="#2f6f6a" stroke-width="2" stroke-dasharray="6 5"/><text x="974.0" y="242.7" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#b4531f" text-anchor="start" font-weight="400" >only surviving branch</text><text x="804.0" y="266.7" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >side branch,</text><text x="804.0" y="284.7" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >extinct ~1 Ma</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Dashed lines show likely but debated ancestry; the tree is a bush, not a ladder.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>