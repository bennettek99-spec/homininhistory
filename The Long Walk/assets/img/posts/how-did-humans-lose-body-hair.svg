<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Timeline of evidence for when humans lost body hair: pubic louse genetics about 3.3 million years ago, debated; the Turkana Boy skeleton about 1.5 million years ago; MC1R pigment gene evidence for bare dark skin by at least 1.2 million years ago; and clothing lice splitting from head lice 83,000 to 170,000 years ago"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">Dating the loss of body hair</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">Four independent clues, millions of years ago</text><line x1="100.0" y1="330.0" x2="1100.0" y2="330.0" stroke="#241b12" stroke-width="2.5" /><line x1="127.8" y1="322.0" x2="127.8" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="127.8" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >3.5 Ma</text><line x1="266.7" y1="322.0" x2="266.7" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="266.7" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >3 Ma</text><line x1="405.6" y1="322.0" x2="405.6" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="405.6" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >2.5 Ma</text><line x1="544.4" y1="322.0" x2="544.4" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="544.4" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >2 Ma</text><line x1="683.3" y1="322.0" x2="683.3" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="683.3" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >1.5 Ma</text><line x1="822.2" y1="322.0" x2="822.2" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="822.2" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >1 Ma</text><line x1="961.1" y1="322.0" x2="961.1" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="961.1" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >0.5 Ma</text><line x1="1100.0" y1="322.0" x2="1100.0" y2="338.0" stroke="#241b12" stroke-width="2" /><text x="1100.0" y="362.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >today</text><line x1="183.3" y1="330.0" x2="183.3" y2="240.0" stroke="#a3957f" stroke-width="2" stroke-dasharray="4 4"/><circle cx="183.3" cy="330" r="9" fill="#a3957f"/><rect x="60.0" y="170.0" width="340.0" height="74.0" rx="8" fill="#fbf6ec" stroke="#a3957f" stroke-width="2"/><text x="74.0" y="196.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="start" font-weight="700" >Pubic louse family tree</text><text x="74.0" y="216.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >head and groin hair habitats separate</text><text x="74.0" y="234.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#a3957f" text-anchor="start" font-weight="700" >~3.3 Ma (debated)</text><line x1="683.3" y1="330.0" x2="683.3" y2="400.0" stroke="#2f6f6a" stroke-width="2" stroke-dasharray="4 4"/><circle cx="683.3" cy="330" r="9" fill="#2f6f6a"/><rect x="430.0" y="400.0" width="340.0" height="74.0" rx="8" fill="#fbf6ec" stroke="#2f6f6a" stroke-width="2"/><text x="444.0" y="426.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="start" font-weight="700" >Turkana Boy skeleton</text><text x="444.0" y="446.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >hot-climate body for long travel</text><text x="444.0" y="464.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#2f6f6a" text-anchor="start" font-weight="700" >~1.5 Ma</text><line x1="766.7" y1="330.0" x2="766.7" y2="240.0" stroke="#b4531f" stroke-width="2" stroke-dasharray="4 4"/><circle cx="766.7" cy="330" r="9" fill="#b4531f"/><rect x="560.0" y="170.0" width="340.0" height="74.0" rx="8" fill="#fbf6ec" stroke="#b4531f" stroke-width="2"/><text x="574.0" y="196.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="start" font-weight="700" >MC1R pigment gene</text><text x="574.0" y="216.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >dark skin under strong selection</text><text x="574.0" y="234.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#b4531f" text-anchor="start" font-weight="700" >≥ ~1.2 Ma</text><line x1="1066.7" y1="330.0" x2="1066.7" y2="400.0" stroke="#a9791f" stroke-width="2" stroke-dasharray="4 4"/><circle cx="1066.7" cy="330" r="9" fill="#a9791f"/><rect x="800.0" y="400.0" width="340.0" height="74.0" rx="8" fill="#fbf6ec" stroke="#a9791f" stroke-width="2"/><text x="814.0" y="426.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="start" font-weight="700" >Clothing louse split</text><text x="814.0" y="446.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >regular clothing (not hair loss)</text><text x="814.0" y="464.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#a9791f" text-anchor="start" font-weight="700" >~83,000–170,000 yr</text><text x="600.0" y="520.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#2f6f6a" text-anchor="middle" font-weight="400" >Bare skin was in place long before clothing became routine</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Dates are estimates from the studies discussed in the article.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>