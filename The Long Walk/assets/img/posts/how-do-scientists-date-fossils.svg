<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Chart of fossil dating methods on a logarithmic time scale: radiocarbon to about 50,000 years; luminescence, uranium-series and electron spin resonance covering the middle range; potassium-argon and argon-argon dating reaching millions of years"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">Which dating method reaches how far back?</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">Approximate working ranges, log scale (years before present)</text><line x1="300.0" y1="140.0" x2="300.0" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="300.0" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >100</text><line x1="454.7" y1="140.0" x2="454.7" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="454.7" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >1,000</text><line x1="609.4" y1="140.0" x2="609.4" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="609.4" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >10,000</text><line x1="764.2" y1="140.0" x2="764.2" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="764.2" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >100,000</text><line x1="918.9" y1="140.0" x2="918.9" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="918.9" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >1 million</text><line x1="1073.6" y1="140.0" x2="1073.6" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="1073.6" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >10 million</text><rect x="717.6" y="136.0" width="154.7" height="388.0" rx="0" fill="#e7d3c2" opacity=".6"/><text x="794.9" y="132.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#b4531f" text-anchor="middle" font-weight="400" >the awkward 50,000–500,000-year window</text><text x="280.0" y="180.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Radiocarbon (¹⁴C)</text><rect x="300.0" y="164.0" width="417.6" height="22.0" rx="4" fill="#b4531f" /><text x="308.0" y="208.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >organic remains; ceiling ~50,000 yr</text><text x="280.0" y="240.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Luminescence (OSL/TL)</text><rect x="454.7" y="224.0" width="402.6" height="22.0" rx="4" fill="#a9791f" /><text x="462.7" y="268.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >sediment last exposed to light or heat</text><text x="280.0" y="300.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Uranium-series</text><rect x="454.7" y="284.0" width="417.6" height="22.0" rx="4" fill="#a9791f" /><text x="462.7" y="328.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >cave carbonates, coral</text><text x="280.0" y="360.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Electron spin resonance</text><rect x="609.4" y="344.0" width="356.0" height="22.0" rx="4" fill="#a9791f" /><text x="617.4" y="388.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >tooth enamel</text><text x="280.0" y="420.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Potassium-argon / argon-argon</text><rect x="764.2" y="404.0" width="355.8" height="22.0" rx="4" fill="#2f6f6a" /><text x="772.2" y="448.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >volcanic ash and lava</text><text x="280.0" y="480.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Palaeomagnetism</text><rect x="656.0" y="464.0" width="464.0" height="22.0" rx="4" fill="#a3957f" /><text x="664.0" y="508.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >magnetic reversals in rock</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Ranges are approximate and depend on the material and laboratory; methods overlap by design.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>