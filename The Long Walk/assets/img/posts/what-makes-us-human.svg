<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Chart on a logarithmic time scale of when human traits appear: bipedalism 7 to 4 million years ago, stone tools 3.3 to 2.6 million years ago, brain expansion from about 2 million years ago, symbolic behaviour 500,000 to 100,000 years ago, and cumulative culture intensifying in the last 100,000 years"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">What makes us human was assembled over time</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">When each trait appears in the record, log scale (years ago)</text><line x1="320.0" y1="140.0" x2="320.0" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="320.0" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >10 Ma</text><line x1="583.3" y1="140.0" x2="583.3" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="583.3" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >1 Ma</text><line x1="846.7" y1="140.0" x2="846.7" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="846.7" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >100 ka</text><line x1="1110.0" y1="140.0" x2="1110.0" y2="520.0" stroke="#ddd1bd" stroke-width="1" /><text x="1110.0" y="545.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >10 ka</text><text x="300.0" y="180.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#241b12" text-anchor="end" font-weight="600" >Upright walking</text><rect x="360.8" y="164.0" width="64.0" height="22.0" rx="4" fill="#a9791f" /><text x="364.8" y="208.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >Sahelanthropus, Ardi, Laetoli</text><text x="300.0" y="252.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#241b12" text-anchor="end" font-weight="600" >Stone tools</text><rect x="446.8" y="236.0" width="27.3" height="22.0" rx="4" fill="#a9791f" /><text x="450.8" y="280.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >Lomekwi (debated), Oldowan</text><text x="300.0" y="324.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#241b12" text-anchor="end" font-weight="600" >Brain expansion</text><rect x="504.1" y="308.0" width="605.9" height="22.0" rx="4" fill="#2f6f6a" /><path d="M1108 308 l14 11 l-14 11z" fill="#2f6f6a"/><text x="508.1" y="352.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >from ~2 Ma onward</text><text x="300.0" y="396.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#241b12" text-anchor="end" font-weight="600" >Symbolic behaviour</text><rect x="662.6" y="380.0" width="184.1" height="22.0" rx="4" fill="#b4531f" /><text x="666.6" y="424.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >ochre, ornaments, burial</text><text x="300.0" y="468.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#241b12" text-anchor="end" font-weight="600" >Cumulative culture</text><rect x="846.7" y="452.0" width="263.3" height="22.0" rx="4" fill="#b4531f" /><text x="850.7" y="496.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" fill="#6c5f4d" text-anchor="start" font-weight="400" >intensifies &lt;100 ka (deep roots)</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Dates as given in the article; each trait has older roots in other apes or hominins.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>