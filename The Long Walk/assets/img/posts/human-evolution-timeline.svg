<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Timeline chart of human evolution eras: first hominins 7 to 4 million years ago, australopithecines 4 to 2, early Homo 2.8 to 1.9, Homo erectus 1.9 million to 110,000 years ago, archaic humans 800,000 to 200,000, Neanderthals and Denisovans 400,000 to 40,000, and modern humans spreading from 70,000 years ago"><rect width="1200" height="630" fill="#f7f0e3"/><rect x="0" y="0" width="1200" height="6" fill="#b4531f"/><text x="60" y="74" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#241b12">Seven million years of human evolution</text><text x="60" y="108" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" fill="#6c5f4d">The eras covered in this timeline, millions of years ago (Ma)</text><line x1="90.0" y1="130.0" x2="90.0" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="90.0" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >7 Ma</text><line x1="235.7" y1="130.0" x2="235.7" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="235.7" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >6 Ma</text><line x1="381.4" y1="130.0" x2="381.4" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="381.4" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >5 Ma</text><line x1="527.1" y1="130.0" x2="527.1" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="527.1" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >4 Ma</text><line x1="672.9" y1="130.0" x2="672.9" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="672.9" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >3 Ma</text><line x1="818.6" y1="130.0" x2="818.6" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="818.6" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >2 Ma</text><line x1="964.3" y1="130.0" x2="964.3" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="964.3" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >1 Ma</text><line x1="1110.0" y1="130.0" x2="1110.0" y2="540.0" stroke="#ddd1bd" stroke-width="1" /><text x="1110.0" y="562.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#6c5f4d" text-anchor="middle" font-weight="400" >today</text><rect x="90.0" y="140.0" width="437.1" height="26.0" rx="4" fill="#a3957f" /><text x="102.0" y="159.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#f7f0e3" text-anchor="start" font-weight="600" >First hominins</text><rect x="527.1" y="196.0" width="291.4" height="26.0" rx="4" fill="#a9791f" /><text x="828.6" y="215.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="start" font-weight="400" >Australopithecines</text><rect x="702.0" y="252.0" width="131.1" height="26.0" rx="4" fill="#a9791f" /><text x="692.0" y="271.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Early Homo &amp; first stone tools</text><rect x="833.1" y="308.0" width="260.8" height="26.0" rx="4" fill="#2f6f6a" /><text x="823.1" y="327.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Homo erectus spreads from Africa</text><rect x="993.4" y="364.0" width="87.4" height="26.0" rx="4" fill="#2f6f6a" /><text x="983.4" y="383.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Archaic humans</text><rect x="1051.7" y="420.0" width="52.5" height="26.0" rx="4" fill="#b4531f" /><text x="1041.7" y="439.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Neanderthals, Denisovans, our origins</text><rect x="1099.8" y="476.0" width="10.2" height="26.0" rx="4" fill="#b4531f" /><text x="1089.8" y="495.0" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="16" fill="#241b12" text-anchor="end" font-weight="400" >Modern humans spread worldwide</text><line x1="60" y1="586" x2="1140" y2="586" stroke="#ddd1bd" stroke-width="1.5"/><text x="60" y="612" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">Eras overlap: several hominin species usually lived at the same time.</text><text x="1140" y="612" text-anchor="end" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#a3957f">homininhistory.com</text></svg>